name = "cartitas-links"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGINS = "https://roma58a.github.io,http://localhost:5500,http://127.0.0.1:5500"

# Crea el KV con: npx wrangler kv namespace create LETTERS
# y pega aquí el id que te devuelve.
[[kv_namespaces]]
binding = "LETTERS"
id = "PEGA_AQUI_EL_ID_DEL_KV"
